<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추첨기</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2200900676006112"
     crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg,#1e1b4b,#312e81,#0f172a);
      --container-bg: rgba(255,255,255,0.08);
      --text-color: white;
      --border-color: rgba(255,255,255,0.15);
      --shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg,#f3f4f6,#e5e7eb,#d1d5db);
      --container-bg: rgba(255,255,255,0.9);
      --text-color: #1f2937;
      --border-color: rgba(0,0,0,0.1);
      --shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Pretendard', sans-serif;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    body{
      background: var(--bg-gradient);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color: var(--text-color);
      padding:30px;
    }

    .container{
      width:100%;
      max-width:520px;
      background: var(--container-bg);
      backdrop-filter: blur(12px);
      border:1px solid var(--border-color);
      border-radius:24px;
      padding:40px 32px;
      box-shadow: var(--shadow);
      position: relative;
      text-align: center;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    h1{
      font-size:32px;
      margin-bottom:8px;
    }

    .subtitle{
      opacity:0.8;
      margin-bottom:32px;
      font-size:14px;
    }

    .lotto-display {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 40px;
      min-height: 60px;
    }

    .ball {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes bounceIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Ball Colors based on number ranges */
    .ball-1-10 { background: radial-gradient(circle at 30% 30%, #facc15, #ca8a04); }
    .ball-11-20 { background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb); }
    .ball-21-30 { background: radial-gradient(circle at 30% 30%, #f87171, #dc2626); }
    .ball-31-40 { background: radial-gradient(circle at 30% 30%, #9ca3af, #4b5563); }
    .ball-41-45 { background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a); }

    .main-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg,#6366f1,#a855f7);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .main-btn:active {
      transform: translateY(0);
    }

    .history {
      margin-top: 30px;
      text-align: left;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .history h3 {
      font-size: 16px;
      margin-bottom: 12px;
      opacity: 0.9;
    }

    .history-item {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    /* Inquiry Form Styles */
    .inquiry-section {
      margin-top: 40px;
      text-align: left;
      border-top: 1px solid var(--border-color);
      padding-top: 30px;
    }

    .inquiry-section h3 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      opacity: 0.8;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: rgba(255,255,255,0.05);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    [data-theme="light"] .form-group input, 
    [data-theme="light"] .form-group textarea {
      background: rgba(0,0,0,0.03);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
    <h1>🍀 로또 추첨기</h1>
    <p class="subtitle">오늘의 행운의 번호를 뽑아보세요!</p>

    <div class="lotto-display" id="lotto-display">
      <!-- Numbers will appear here -->
    </div>

    <button class="main-btn" onclick="drawLotto()">번호 추첨하기</button>

    <div class="history" id="history-section" style="display: none;">
      <h3>최근 추첨 이력</h3>
      <div id="history-list"></div>
    </div>

    <!-- Affiliate Inquiry Form -->
    <div class="inquiry-section">
      <h3>🤝 제휴 문의</h3>
      <form action="https://formspree.io/f/xvzljldl" method="POST">
        <div class="form-group">
          <label>성함/업체명</label>
          <input type="text" name="name" required placeholder="홍길동">
        </div>
        <div class="form-group">
          <label>이메일 주소</label>
          <input type="email" name="_replyto" required placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label>문의 내용</label>
          <textarea name="message" rows="4" required placeholder="문의하실 내용을 적어주세요."></textarea>
        </div>
        <button type="submit" class="submit-btn">문의 보내기</button>
      </form>
    </div>
  </div>

  <script>
    // Theme switching logic
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
      const themeBtn = document.getElementById('theme-btn');
      themeBtn.innerText = theme === 'dark' ? '🌙' : '☀️';
    }

    initTheme();

    function getBallClass(num) {
      if (num <= 10) return 'ball-1-10';
      if (num <= 20) return 'ball-11-20';
      if (num <= 30) return 'ball-21-30';
      if (num <= 40) return 'ball-31-40';
      return 'ball-41-45';
    }

    function drawLotto() {
      const display = document.getElementById('lotto-display');
      display.innerHTML = '';
      
      const numbers = [];
      while (numbers.length < 6) {
        const num = Math.floor(Math.random() * 45) + 1;
        if (!numbers.includes(num)) {
          numbers.push(num);
        }
      }
      numbers.sort((a, b) => a - b);

      numbers.forEach((num, index) => {
        setTimeout(() => {
          const ball = document.createElement('div');
          ball.className = `ball ${getBallClass(num)}`;
          ball.innerText = num;
          display.appendChild(ball);
        }, index * 150);
      });

      // Update history
      setTimeout(() => {
        const historySection = document.getElementById('history-section');
        const historyList = document.getElementById('history-list');
        historySection.style.display = 'block';

        const historyItem = document.createElement('div');
        historyItem.className = 'history-item';
        const now = new Date().toLocaleTimeString();
        historyItem.innerHTML = `<span>${numbers.join(', ')}</span> <span>${now}</span>`;
        
        historyList.insertBefore(historyItem, historyList.firstChild);
        if (historyList.children.length > 5) {
          historyList.removeChild(historyList.lastChild);
        }
      }, 1000);
    }
  </script>

</body>
</html>
